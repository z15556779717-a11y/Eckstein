name: iOS Release Check

# Compiles the app in the Release configuration on a GitHub-hosted macOS runner.
#
# Why this exists: ios.yml builds Debug, and Debug is not what ships. A Release
# build compiles the same source with whole-module optimization and without any
# `#if DEBUG` block, so a compile error that only exists in Release — a symbol
# used only outside a DEBUG guard, an `-O` exclusivity diagnostic — would
# otherwise not surface until the first Archive, which needs a signing
# certificate this repo does not have.
#
# Deliberately narrow:
#   * No code signing and no secrets. This is a compile check, not a
#     distribution build: there is no Archive and no TestFlight upload.
#   * No tests. ios.yml runs them in Debug; repeating them here would double
#     the wait for no new signal.
#   * No simulator boot. A generic iOS Simulator destination is enough to
#     compile and link.

on:
  push:
    branches:
      - main
      - 'develop/**'
  pull_request:
    branches:
      - main
      - 'develop/**'

concurrency:
  group: ios-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-build:
    name: Release build (iOS Simulator, no code signing)
    runs-on: macos-latest
    timeout-minutes: 45

    env:
      PROJECT: Eckstein/Eckstein.xcodeproj
      SCHEME: Eckstein
      # Explicit so the verification step below can name the product instead of
      # searching for it.
      DERIVED_DATA: ${{ runner.temp }}/DerivedData

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: xcodebuild -version

      - name: Resolve Swift Package dependencies
        run: |
          xcodebuild -resolvePackageDependencies \
            -project "$PROJECT" \
            -scheme "$SCHEME"

      - name: Resolve Supabase configuration
        id: supabase
        env:
          CONFIGURED_URL: ${{ vars.SUPABASE_URL }}
          CONFIGURED_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          # The publishable key is a public credential, but it still does not
          # belong in a build log. Mask it before anything can print it, and
          # refer to it below only through shell variables: a `run` block is
          # echoed with its expressions expanded but its `$VAR` references
          # left alone.
          if [ -n "$CONFIGURED_KEY" ]; then
            echo "::add-mask::$CONFIGURED_KEY"
          fi

          # Repository variables are optional. Without them the build stays
          # unconfigured, which is a supported state: `isSupabaseConfigured`
          # gates every network path off rather than attempting a call against
          # a placeholder host.
          if [ -n "$CONFIGURED_URL" ] && [ -n "$CONFIGURED_KEY" ]; then
            echo "Supabase configuration found; the build will carry it."
          else
            echo "No Supabase repository variables; building unconfigured."
          fi

      - name: Build app in Release (no code signing)
        env:
          CONFIGURED_URL: ${{ vars.SUPABASE_URL }}
          CONFIGURED_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          # `Info.plist` carries `$(SUPABASE_URL)` and `$(SUPABASE_PUBLISHABLE_KEY)`
          # and the build expands them from these settings. That indirection is
          # what keeps the real values out of the repository. When the variables
          # are unset they expand to empty strings, which
          # `EnvironmentLoader.infoPlistValues` discards -- so an unset variable
          # leaves the build unconfigured rather than half-configured.
          #
          # `-derivedDataPath` is explicit so the check below knows exactly where
          # the product is instead of searching for it.
          xcodebuild build \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Release \
            -derivedDataPath "$DERIVED_DATA" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            SUPABASE_URL="$CONFIGURED_URL" \
            SUPABASE_PUBLISHABLE_KEY="$CONFIGURED_KEY"

      - name: Confirm the configuration reached the built Info.plist
        env:
          CONFIGURED_URL: ${{ vars.SUPABASE_URL }}
          CONFIGURED_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          # Reports whether a key is present, never what it is. A build that
          # silently drops the setting is the failure this step exists to catch.
          APP=$(find "$DERIVED_DATA/Build/Products" -type d -name "Eckstein.app" 2>/dev/null | head -1)
          echo "searching $DERIVED_DATA/Build/Products"

          if [ -z "$APP" ]; then
            echo "::error::no Eckstein.app found; build products are:"
            find "$DERIVED_DATA/Build/Products" -maxdepth 3 2>/dev/null || true
            exit 1
          fi
          echo "app bundle: $APP"

          PLIST="$APP/Info.plist"
          if [ ! -f "$PLIST" ]; then
            echo "::error::the built bundle has no Info.plist"
            ls -la "$APP" || true
            exit 1
          fi
          echo "Info.plist: present"

          # Repository variables are optional, and the build is expected to stay
          # unconfigured without them. It is only a failure for a key to be
          # missing from a build that was actually given both values.
          MISSING=0
          for KEY in SUPABASE_URL SUPABASE_PUBLISHABLE_KEY; do
            VALUE=$(/usr/libexec/PlistBuddy -c "Print :$KEY" "$PLIST" 2>/dev/null || true)
            if [ -n "$VALUE" ]; then
              echo "$KEY: present"
            elif [ -n "$CONFIGURED_URL" ] && [ -n "$CONFIGURED_KEY" ]; then
              echo "::error::$KEY: absent, but the repository variables are set"
              MISSING=1
            else
              echo "$KEY: absent (repository variables not set; unconfigured build)"
            fi
          done
          exit $MISSING
