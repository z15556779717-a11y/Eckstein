name: iOS Unsigned IPA

# Produces an unsigned device build packaged as an `.ipa`, for re-signing on a
# machine that has no Apple Developer certificate.
#
# Why this is a separate workflow: `ios.yml` builds and tests, and
# `ios-release-check.yml` compiles Release for a simulator to prove it builds.
# Neither produces something a sideloading tool can consume, and neither should
# change to. This one does nothing else.
#
# What "unsigned" means here: `CODE_SIGNING_ALLOWED=NO` skips the packaging and
# signing steps entirely, so the `.app` ships with no `_CodeSignature` and no
# `embedded.mobileprovision`. Entitlements are not applied either -- the
# `CODE_SIGN_ENTITLEMENTS` build setting is only ever read by `codesign`, which
# never runs. That is what lets a project with HealthKit and CloudKit
# entitlements build without any provisioning profile at all.
#
# Run it by tagging the commit you want built:
#
#   git tag ipa-1.0.0-1
#   git push origin ipa-1.0.0-1
#
# A tag is the trigger because `workflow_dispatch` would require this file to
# exist on the default branch, and it deliberately does not: it lives on
# `develop/my-fitness-app` only. Tag pushes have no such requirement, so this
# builds the exact commit it is pointed at and nothing else. An ordinary push to
# `develop/**` does not produce an IPA.
#
# The `SUPABASE_URL` and `SUPABASE_PUBLISHABLE_KEY` repository variables are
# required, not optional. `Info.plist` holds them as `$(...)` references and the
# build expands them; with the variables unset the references expand to empty
# strings and the app ships pointed at a host that cannot resolve. That shipped
# once, so this workflow now refuses to build without them and fails the build
# if either key arrives empty or unexpanded.

on:
  push:
    tags:
      - 'ipa-*'

concurrency:
  group: ios-unsigned-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unsigned-ipa:
    name: Unsigned device IPA
    runs-on: macos-latest
    timeout-minutes: 45

    env:
      PROJECT: Eckstein/Eckstein.xcodeproj
      SCHEME: Eckstein

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: xcodebuild -version

      - name: Resolve Swift Package dependencies
        run: |
          xcodebuild -resolvePackageDependencies \
            -project "$PROJECT" \
            -scheme "$SCHEME"

      - name: Resolve Supabase configuration
        env:
          CONFIGURED_URL: ${{ vars.SUPABASE_URL }}
          CONFIGURED_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          # Mask before anything else can print it. This step exists separately
          # from the build for that reason: a step's `env:` block is echoed into
          # the log with its expressions expanded, so the build step below would
          # print the key in its own header unless the mask is already
          # registered by the time it starts.
          if [ -n "$CONFIGURED_KEY" ]; then
            echo "::add-mask::$CONFIGURED_KEY"
          fi

          # The publishable key is a public credential, but "public" is not
          # "belongs in a build log", and neither value is ever echoed here.
          #
          # Unlike the Release check, an unconfigured build is not a supported
          # outcome for this workflow: the whole point of the artifact is an app
          # that can reach Supabase. An IPA that installs and then fails every
          # request is worse than no IPA, so this fails now rather than after
          # the download.
          if [ -z "$CONFIGURED_URL" ] || [ -z "$CONFIGURED_KEY" ]; then
            echo "::error::SUPABASE_URL and SUPABASE_PUBLISHABLE_KEY repository variables must both be set for an IPA build"
            exit 1
          fi
          echo "Supabase configuration found; the build will carry it."

      - name: Build for device in Release (no code signing)
        env:
          CONFIGURED_URL: ${{ vars.SUPABASE_URL }}
          CONFIGURED_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          # `generic/platform=iOS` is the device destination. The project sets
          # SDKROOT = auto and lists macosx and xros among its supported
          # platforms, so the destination has to be stated rather than inferred.
          #
          # `Info.plist` carries `$(SUPABASE_URL)` and
          # `$(SUPABASE_PUBLISHABLE_KEY)`; these two settings are what expand
          # them. Without them the references expand to empty strings and the
          # app ships pointing at `https://unconfigured.invalid`, which is a
          # build that installs and then cannot sign anybody in.
          #
          # The values are referenced only as shell variables. A `run` block is
          # echoed with its expressions expanded but its `$VAR` references left
          # alone, so naming the secret directly here would print it.
          DERIVED_DATA="$RUNNER_TEMP/DerivedData"
          xcodebuild build \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$DERIVED_DATA" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_STYLE=Manual \
            PROVISIONING_PROFILE_SPECIFIER="" \
            DEVELOPMENT_TEAM="" \
            SUPABASE_URL="$CONFIGURED_URL" \
            SUPABASE_PUBLISHABLE_KEY="$CONFIGURED_KEY"

      - name: Confirm the Supabase configuration reached the built Info.plist
        run: |
          # Reports one of present / missing / placeholder per key, never a
          # value. This is the check whose absence shipped an unconfigured IPA:
          # the build succeeded, the bundle looked complete, and the two keys
          # were empty strings.
          DERIVED_DATA="$RUNNER_TEMP/DerivedData"
          APP="$DERIVED_DATA/Build/Products/Release-iphoneos/Eckstein.app"

          if [ ! -f "$APP/Info.plist" ]; then
            echo "::error::no Info.plist at $APP"
            ls -la "$DERIVED_DATA/Build/Products/Release-iphoneos" 2>/dev/null || true
            exit 1
          fi
          echo "app bundle: $APP"

          MISSING=0
          for KEY in SUPABASE_URL SUPABASE_PUBLISHABLE_KEY; do
            VALUE=$(/usr/libexec/PlistBuddy -c "Print :$KEY" "$APP/Info.plist" 2>/dev/null || true)
            case "$VALUE" in
              '')
                echo "::error::$KEY: missing"
                MISSING=1
                ;;
              *'$('*)
                # An unexpanded `$(...)` means the setting never reached the
                # build, which is the same failure wearing a non-empty value.
                echo "::error::$KEY: placeholder"
                MISSING=1
                ;;
              *)
                echo "$KEY: present"
                ;;
            esac
          done
          exit $MISSING

      - name: Package Payload into an IPA
        run: |
          DERIVED_DATA="$RUNNER_TEMP/DerivedData"
          APP="$DERIVED_DATA/Build/Products/Release-iphoneos/Eckstein.app"

          if [ ! -d "$APP" ]; then
            echo "::error::no device app at $APP"
            find "$DERIVED_DATA/Build/Products" -maxdepth 2 || true
            exit 1
          fi
          echo "app: $APP"

          STAGE="$RUNNER_TEMP/stage"
          rm -rf "$STAGE"
          mkdir -p "$STAGE/Payload"
          cp -R "$APP" "$STAGE/Payload/"

          # An IPA is a zip whose root contains Payload/.
          ( cd "$STAGE" && zip -qry "$RUNNER_TEMP/Eckstein.ipa" Payload )

          # The manifest an unsigned build may not have written; its absence is
          # the signature check below, so it is reported rather than required.
          if [ -e "$APP/_CodeSignature" ]; then
            echo "::warning::the app carries a _CodeSignature; this was not an unsigned build"
          else
            echo "unsigned: no _CodeSignature in the app bundle"
          fi
          if [ -e "$APP/embedded.mobileprovision" ]; then
            echo "::warning::the app carries a provisioning profile"
          else
            echo "unsigned: no embedded.mobileprovision"
          fi

      - name: Verify it is a device build, not a simulator build
        run: |
          # The failure this catches is silent: a simulator binary produces an
          # IPA that looks fine and cannot be installed. `lipo` is the check.
          STAGE="$RUNNER_TEMP/stage"
          BIN="$STAGE/Payload/Eckstein.app/Eckstein"

          if [ ! -f "$BIN" ]; then
            echo "::error::no executable in the packaged app"
            ls -la "$STAGE/Payload/Eckstein.app" || true
            exit 1
          fi

          ARCHS=$(lipo -archs "$BIN")
          echo "architectures: $ARCHS"
          echo "bundle id: $(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$STAGE/Payload/Eckstein.app/Info.plist")"
          echo "executable size: $(stat -f%z "$BIN") bytes"
          echo "ipa size: $(stat -f%z "$RUNNER_TEMP/Eckstein.ipa") bytes"

          case "$ARCHS" in
            *x86_64*|*arm64_simulator*|*i386*)
              echo "::error::the binary has a simulator slice ($ARCHS)"
              exit 1
              ;;
          esac
          case "$ARCHS" in
            *arm64*) echo "device arm64 confirmed" ;;
            *) echo "::error::no arm64 slice ($ARCHS)"; exit 1 ;;
          esac

          # vtool states the platform outright, which `lipo` does not.
          if command -v vtool >/dev/null; then
            vtool -show-build "$BIN" | grep -E "platform|minos|sdk" || true
          fi

      - name: Upload the IPA
        uses: actions/upload-artifact@v4
        with:
          name: Eckstein-unsigned-ipa
          path: ${{ runner.temp }}/Eckstein.ipa
          if-no-files-found: error
          retention-days: 30
